<!doctype html><html lang='fr'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#0b5cff'><title>Objectif 5K Swim</title><link rel='manifest' href='manifest.json'><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#10213a;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;padding:0 0 84px}.top{padding:22px 18px 14px;background:linear-gradient(135deg,#0b5cff,#16a6c9);color:white;border-radius:0 0 26px 26px}.top h1{margin:0;font-size:27px}.top p{margin:6px 0 0;opacity:.9}.wrap{padding:14px;max-width:720px;margin:auto}.card{background:white;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 5px 18px #16345a12}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.big{font-size:31px;font-weight:800}.muted{color:#65758b;font-size:13px}.bar{height:11px;background:#e8eef7;border-radius:99px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:#0b5cff}.pill{background:#e9f1ff;color:#0b5cff;padding:6px 10px;border-radius:99px;font-weight:700;font-size:12px}.block{border-top:1px solid #edf1f6;padding:12px 0}.block:first-child{border-top:0}.check{width:25px;height:25px}button{border:0;border-radius:13px;padding:12px 14px;font-weight:750;background:#0b5cff;color:white;font-size:15px}button.secondary{background:#e9f1ff;color:#0b5cff}input,select,textarea{width:100%;padding:11px;border:1px solid #d9e1ec;border-radius:11px;font-size:16px;background:white}label{font-size:12px;color:#65758b;display:block;margin:10px 0 5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e5eaf1;display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:5}.nav button{background:none;color:#6a788d;padding:8px;font-size:12px}.nav button.active{color:#0b5cff}.hidden{display:none}.exercise{display:grid;grid-template-columns:1fr 90px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #eef2f6}.tag{font-size:12px;font-weight:700;color:#0b5cff}.success{color:#14865c;font-weight:700}h2{margin:5px 0 12px}h3{margin:4px 0 8px}.smallbtn{padding:8px 10px;font-size:12px}.history{padding:10px 0;border-bottom:1px solid #eef2f6}
</style></head><body><header class='top'><h1>🏊 Objectif 5K Swim</h1><p>5 km eau libre • Avril / Mai 2027</p></header><main class='wrap'>
<section id='home'></section><section id='session' class='hidden'></section><section id='log' class='hidden'></section><section id='strength' class='hidden'></section><section id='history' class='hidden'></section>
</main><nav class='nav'><button data-tab='home' class='active'>Accueil</button><button data-tab='session'>Natation</button><button data-tab='log'>Résultats</button><button data-tab='strength'>Muscu</button><button data-tab='history'>Historique</button></nav>
<script>
const swims=[
[1,2000,'Installation de l’endurance',['200 EF + 4×50 technique R15″','4×300 END R30″','2×50 soutenus R20″','300 facile']],
[2,2100,'Allonger les répétitions',['200 EF + 4×50 technique','2×500 END R40″','4×100 TEMPO R20″','300 facile']],
[3,2200,'Premier continu long',['300 EF + 4×50 technique','1500 continu : 500 EF + 500 END + 500 END','2×100 TEMPO R20″']],
[4,1800,'Assimilation',['300 EF + 6×50 technique','6×200 END R20″']],
[5,2200,'Endurance 400',['300 EF + 4×50 technique','4×400 END R30″','100 facile']],
[6,2400,'Endurance 800',['300 EF + 4×50 technique','2×800 END R45″','2×100 TEMPO R20″','100 facile']],
[7,2500,'Longue 1800',['300 EF + 200 technique','1800 continu : 600 EF + 600 END + 600 END','2×100 TEMPO']],
[8,2000,'Assimilation',['300 EF + 4×50 technique','6×200 END R20″','3×100 facile']],
[9,2500,'Volume contrôlé',['300 EF + 4×50 technique','4×400 END R30″','4×100 TEMPO R20″']],
[10,2700,'Blocs de 600',['400 EF','4×50 technique','3×600 END R30″','2×100 TEMPO','100 facile']],
[11,2900,'2 km continu',['300 EF + 4×50 technique','2000 continu : 500 EF + 1000 AS5 + 500 EF','4×100 TEMPO']],
[12,2200,'Assimilation',['400 EF','6×250 END R25″','300 facile']],
[13,2800,'Blocs de 700',['400 EF + 200 technique','3×700 END R30″','100 facile']],
[14,3000,'Deux fois 1 km',['400 EF + 200 technique','2×1000 END R45″','3×100 TEMPO','100 facile']],
[15,3200,'2,4 km continu',['400 EF + 200 technique','2400 continu : 800 EF + 800 AS5 + 800 END','2×100 TEMPO']],
[16,2500,'Assimilation',['400 EF','7×250 END R20″','350 facile']],
[17,3200,'3 × 800',['400 EF + 200 technique','3×800 END/AS5 R30″','200 facile']],
[18,3400,'2,5 km continu',['400 EF + 200 technique','2500 : 1000 EF + 1000 AS5 + 500 END','2×100 TEMPO','100 facile']],
[19,3600,'Test endurance longue',['400 EF + 200 technique','2800 : 700 EF + 700 AS5 + 700 AS5 + 700 EF','2×100 TEMPO']],
[20,2800,'Assimilation',['400 EF','8×250 END R20″','400 facile']],
[21,3600,'Spécifique 5 km',['400 EF + 200 technique','3×800 AS5 R30″','4×100 TEMPO R20″','200 facile']],
[22,3800,'3 km continu',['400 EF','3000 : 1000 EF + 1000 AS5 + 1000 END','400 facile']],
[23,4200,'Longue 3,4 km',['400 EF','4×50 technique','3400 : 1000 EF + 1000 AS5 + 1000 AS5 + 400 EF','200 facile']],
[24,3000,'Assimilation',['400 EF','5×400 END R25″','4×100 TEMPO','200 facile']],
[25,4000,'Spécifique 4 km',['400 EF','3×1000 AS5 R30″','600 facile']],
[26,4500,'Longue 4,5 km',['500 EF','3500 : 1000 EF + 1500 AS5 + 1000 END','500 facile']],
[27,5000,'TEST 5 KM',['500 EF très contrôlé','4000 : 1000 END + 2000 AS5 + 1000 END','500 EF']],
[28,3500,'Récupération active',['400 EF','6×400 END R25″','4×50 technique','500 facile']],
[29,2800,'Affûtage',['400 EF','4×400 AS5 R30″','4×100 TEMPO R25″','400 facile']],
[30,2000,'Semaine course',['400 EF','6×200 END/AS5 R20″','4×50 soutenus propres','200 facile']]
];
const muscu={A:[['Échauffement','10 min'],['Lat pulldown / tractions','4×6 • RIR2'],['Rowing poitrine appuyée','4×8 • RIR2'],['Développé incliné haltères','4×8 • RIR2'],['Rowing unilatéral','3×10/côté'],['Straight-arm pulldown','3×12'],['Face pull','3×15'],['Pallof press','3×12/côté'],['Hollow hold','3×30–40″'],['Rotation externe + Y raise','2×15 + 2×12']],B:[['Échauffement vélo/mobilité','10 min'],['Presse','4×8 • RIR2'],['Hip thrust','4×8'],['Leg curl','4×10'],['Split squat adapté','3×8/jambe'],['Leg extension léger','3×12'],['Mollets','3×15'],['Dead bug','3×10/côté'],['Side plank','3×40″/côté'],['Bird dog','2×10/côté']],C:[['Échauffement SkiErg/mobilité','10 min'],['Lat pulldown neutre','4×8'],['Rowing unilatéral','3×10/côté'],['Landmine press','3×8/côté'],['Straight-arm pulldown','3×12'],['Pullover poulie','3×12'],['Face pull','3×15'],['Rotation externe','3×15'],['Woodchopper','3×10/côté'],['Pallof press','3×12/côté'],['SkiErg','6×30″ soutenu / 30″ facile']],D:[['Échauffement','10 min'],['Goblet squat / presse','3×10 • RIR3'],['RDL haltères','3×10 • RIR3'],['Développé haltères','3×10'],['Rowing assis','3×10'],['Lat pulldown','3×10'],['Élévations latérales','3×15'],['Face pull','3×15'],['Farmer carry','4×30–40 m'],['Planche','3×45″'],['SkiErg','5×1′ RPE7 / 1′ facile']]};
let week=+(localStorage.week||1);let logs=JSON.parse(localStorage.logs||'[]');let mlogs=JSON.parse(localStorage.mlogs||'[]');
function $ (id){return document.getElementById(id)};function pace(sec,dist){if(!sec||!dist)return '—';let p=sec/dist*100,m=Math.floor(p/60),s=Math.round(p%60);return `${m}'${String(s).padStart(2,'0')}″`;}
function renderHome(){let s=swims[week-1], pct=Math.min(100,Math.round(s[1]/5000*100));$('home').innerHTML=`<div class=card><div class=row><div><div class=muted>PROGRESSION ACTUELLE</div><div class=big>${s[1]} m</div></div><span class=pill>${pct}% des 5 km</span></div><div class=bar><i style='width:${pct}%'></i></div><div class=muted>Semaine ${week}/30 • ${s[2]}</div></div><div class=card><h2>Prochaine natation</h2><h3>${s[1]} m • ${s[2]}</h3><p class=muted>EF 2'25–2'35 • END 2'15–2'25 • AS5 2'15–2'20 • TEMPO 2'05–2'15</p><button onclick="show('session')">Voir la séance</button></div><div class=card><h3>Changer de semaine</h3><div class=row><button class=secondary onclick='setWeek(-1)'>← précédente</button><b>${week}</b><button class=secondary onclick='setWeek(1)'>suivante →</button></div></div>`}
function renderSession(){let s=swims[week-1];$('session').innerHTML=`<div class=card><div class=row><div><div class=muted>SEMAINE ${week}</div><div class=big>${s[1]} m</div></div><span class=pill>${s[2]}</span></div></div><div class=card>${s[3].map((x,i)=>`<div class=block><label style='display:flex;gap:12px;align-items:center;margin:0'><input class=check type=checkbox> <span><b>Bloc ${i+1}</b><br>${x}</span></label></div>`).join('')}</div><div class=card><b>Consigne :</b> départ contrôlé. Si la technique se dégrade, ralentis avant de réduire la distance.<br><br><button onclick="show('log')">Renseigner mes résultats</button></div>`}
function renderLog(){$('log').innerHTML=`<div class=card><h2>Résultat natation</h2><div class=grid><div><label>Date</label><input id=lDate type=date></div><div><label>Distance (m)</label><input id=lDist type=number value='${swims[week-1][1]}'></div><div><label>Durée (min)</label><input id=lMin type=number step=.01></div><div><label>FC moyenne</label><input id=lHr type=number></div><div><label>FC max</label><input id=lHrMax type=number></div><div><label>SWOLF</label><input id=lSwolf type=number></div><div><label>RPE /10</label><input id=lRpe type=number min=1 max=10></div><div><label>Ressenti</label><select id=lFeel><option>Très facile</option><option>Bien</option><option>Moyen</option><option>Difficile</option><option>Très difficile</option></select></div></div><label>Commentaire / données montre</label><textarea id=lNote rows=4 placeholder='Ex : technique stable jusqu’à 2500 m, épaules OK...'></textarea><br><br><button onclick='saveLog()'>Enregistrer</button></div>`}
function saveLog(){let d=+$('lDist').value,m=+$('lMin').value;let obj={date:$('lDate').value||new Date().toISOString().slice(0,10),week,dist:d,min:m,pace:pace(m*60,d),hr:$('lHr').value,hrmax:$('lHrMax').value,swolf:$('lSwolf').value,rpe:$('lRpe').value,feel:$('lFeel').value,note:$('lNote').value};logs.unshift(obj);localStorage.logs=JSON.stringify(logs);alert('Séance enregistrée ✓');renderHistory();show('history')}
function renderStrength(){let html=`<div class=card><h2>Musculation • 1h15</h2><p class=muted>4 séances complètes intégrées. Coche chaque exercice, note ta charge et ton ressenti.</p><select id=mSel onchange='drawM()'><option>A</option><option>B</option><option>C</option><option>D</option></select></div><div id=mBody></div>`;$('strength').innerHTML=html;drawM()}
function drawM(){let k=$('mSel').value;let names={A:'Haut du corps / Force',B:'Jambes / Core',C:'Spécifique natation',D:'Full body / Entretien'};let rests={A:['—','2 min','1 min 30','1 min 30','1 min','1 min','45 s','45 s','30 s','30 s'],B:['—','2 min','1 min 30','1 min 15','1 min 15','1 min','45 s','30 s','30 s','30 s'],C:['—','1 min 30','1 min','1 min','1 min','1 min','45 s','30–45 s','45 s','45 s','—'],D:['—','1 min 15','1 min 15','1 min','1 min','1 min','45 s','45 s','45 s','30 s','—']};$('mBody').innerHTML=`<div class=card><div class=row><div><div class=muted>SÉANCE ${k}</div><h2>${names[k]}</h2></div><span class=pill>≈ 75 min</span></div>${muscu[k].map((e,i)=>`<div class=exercise style='grid-template-columns:1fr 105px'><label style='margin:0;display:flex;gap:8px;align-items:flex-start'><input class=check type=checkbox> <span><b>${e[0]}</b><br><span class=muted>${e[1]} • récup ${rests[k][i]}</span></span></label><input id='mc${i}' style='padding:7px' placeholder='charge'></div>`).join('')}<div class=grid><div><label>RPE séance /10</label><input id=mRpe type=number min=1 max=10></div><div><label>Durée (min)</label><input id=mDur type=number value=75></div></div><label>Notes</label><textarea id=mNote rows=3 placeholder='Ex : charges, fatigue, douleur, progression...'></textarea><br><br><button onclick="saveMuscu('${k}')">Enregistrer la séance ${k}</button><p class=muted>Consigne : garder généralement 2 répétitions en réserve. Si natation longue le lendemain, ne pas aller à l’échec.</p></div>`}
function saveMuscu(k){let charges=muscu[k].map((e,i)=>({exercise:e[0],load:document.getElementById('mc'+i)?.value||''}));mlogs.unshift({date:new Date().toISOString().slice(0,10),type:k,dur:document.getElementById('mDur').value||75,rpe:document.getElementById('mRpe').value||'',note:document.getElementById('mNote').value||'',charges});localStorage.mlogs=JSON.stringify(mlogs);alert('Séance musculation enregistrée ✓');renderHistory();show('history')}
function renderHistory(){let swimHtml=logs.length?logs.map(x=>`<div class=history><div class=row><b>🏊 S${x.week} • ${x.dist} m</b><span class=pill>${x.pace}/100</span></div><div class=muted>${x.date} • ${x.min} min • FC ${x.hr||'—'} • RPE ${x.rpe||'—'}/10 • ${x.feel}</div>${x.note?`<div style='margin-top:5px'>${x.note}</div>`:''}</div>`).join(''):'<p class=muted>Aucune natation enregistrée.</p>';let muscuHtml=mlogs.length?mlogs.map(x=>`<div class=history><div class=row><b>🏋️ Muscu ${x.type}</b><span class=pill>${x.dur} min</span></div><div class=muted>${x.date} • RPE ${x.rpe||'—'}/10</div>${x.note?`<div style='margin-top:5px'>${x.note}</div>`:''}</div>`).join(''):'<p class=muted>Aucune musculation enregistrée.</p>';$('history').innerHTML=`<div class=card><h2>Historique natation</h2>${swimHtml}</div><div class=card><h2>Historique musculation</h2>${muscuHtml}</div>`}
function setWeek(n){week=Math.max(1,Math.min(30,week+n));localStorage.week=week;renderAll()}
function show(id){document.querySelectorAll('main>section').forEach(x=>x.classList.add('hidden'));$(id).classList.remove('hidden');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));scrollTo(0,0)}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.tab));function renderAll(){renderHome();renderSession();renderLog();renderStrength();renderHistory()}renderAll();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
